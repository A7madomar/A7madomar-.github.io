<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SID: 172728 | Contact Me</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .contact-wrapper {
        max-width: 700px;
        margin: 40px auto 60px;
        background: white;
        border: 1px solid #dbe3f0;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(11, 31, 58, 0.08);
      }

      .contact-form {
        display: grid;
        gap: 18px;
      }

      .form-group {
        display: grid;
        gap: 8px;
      }

      label {
        font-weight: 700;
        color: var(--primary);
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      .submit-btn {
        background: var(--secondary);
        color: white;
        border: none;
        padding: 13px 20px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .submit-btn:hover {
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <div class="brand">Ahmad Omar Ahmad Khazally</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="contact.html" class="active">Contact Me</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="contact-wrapper">
        <h2>Contact Me</h2>
        <form id="contactForm" class="contact-form">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" />
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" />
          </div>

          <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments"></textarea>
          </div>

          <button type="submit" class="submit-btn">Submit</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Ahmad Omar Ahmad Khazally</p>
    </footer>

    <script>
      document.getElementById("contactForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const fields = [
          document.getElementById("fullName"),
          document.getElementById("email"),
          document.getElementById("country"),
          document.getElementById("comments")
        ];

        for (const field of fields) {
          if (!field.value.trim()) {
            alert("Please fill in all fields before submitting.");
            field.focus();
            return;
          }
        }

        alert("Form submitted successfully!");
        this.reset();
      });
    </script>
  </body>
</html>
